name: Automated linters

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  oxlint:
    
    runs-on: ubuntu-latest

    strategy:
      matrix: { dir: ["./web", "./api"]}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js Setup
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Install Packages
        working-directory: ${{ matrix.dir }}
        run: npm ci

      - name: Run oxlint with reviewdog
        working-directory: ${{ matrix.dir }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx oxlint --format checkstyle | reviewdog -f=checkstyle -reporter=github-pr-review -fail-level=error
spring.application.name=saver-web

spring.datasource.url=jdbc:postgresql://localhost:5432/saver_db
spring.datasource.username=saverUser
spring.datasource.password=saverPassword
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=saver_web_super_secret_key_32_bytes_long_minimum!
jwt.expiration-ms=86400000

spring.main.banner-mode=off
logging.level.root=WARN
logging.level.com.example=INFO
spring.jpa.open-in-view=false


# for the persistant storage
# define STORAGE_PATH inside the docker and mount a volume there.
storage.path=${STORAGE_PATH:./data}